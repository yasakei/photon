#:schema ../extra/schemas/color-theme.json

[color-theme]
name = "Photon Dark"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 50
scroll-width = 10
drop-shadow-width = 0

# TokyoNight Night palette (LazyVim's default look):
# bg #1a1b26, bg_dark #16161e, bg_highlight #292e42, fg #c0caf5
[color-theme.base]
black = "#1a1b26"
blue = "#7aa2f7"
blue1 = "#2ac3de"
blue5 = "#89ddff"
cyan = "#7dcfff"
green = "#9ece6a"
green1 = "#73daca"
grey = "#3b4261"
magenta = "#bb9af7"
orange = "#ff9e64"
purple = "#9d7cd8"
red = "#f7768e"
white = "#c0caf5"
yellow = "#e0af68"
fg-dark = "#a9b1d6"

primary-background = "$black"
# Background for 'secondary' elements: panels, palette, status bar, completion, hover
secondary-background = "#16161e"
current-background = "#292e42"
text = "$white"
dim-text = "#565f89"

[color-theme.syntax]
"comment" = "$dim-text"
"constant" = "$orange"
"type" = "$blue1"
"typeAlias" = "$blue1"
"number" = "$orange"
"enum" = "$blue1"
"struct" = "$blue1"
"structure" = "$blue1"
"interface" = "$blue1"
"attribute" = "$yellow"
"constructor" = "$blue"
"function" = "$blue"
"method" = "$blue"
"function.method" = "$blue"
"keyword" = "$magenta"
"selfKeyword" = "$magenta"
"field" = "$green1"
"property" = "$green1"
"enumMember" = "$green1"
"enum-member" = "$green1"
"string" = "$green"
"type.builtin" = "$cyan"
"builtinType" = "$cyan"
"escape" = "$cyan"
"string.escape" = "$cyan"
"embedded" = "$cyan"
"punctuation.delimiter" = "$fg-dark"
"text.title" = "$yellow"
"text.uri" = "$cyan"
"text.reference" = "$green1"
"variable" = "$text"
"variable.other.member" = "$green1"
"tag" = "$red"

"markup.heading" = "$yellow"
"markup.bold" = "$orange"
"markup.italic" = "$magenta"
"markup.list" = "$blue5"
"markup.link.url" = "$cyan"
"markup.link.label" = "$purple"
"markup.link.text" = "$green"

"bracket.color.1" = "$yellow"
"bracket.color.2" = "$magenta"
"bracket.color.3" = "$blue"
"bracket.unpaired" = "$red"

[color-theme.ui]
"photon.error" = "$red"
"photon.warn" = "$yellow"
"photon.dropdown_shadow" = "#000000"
"photon.border" = "#15161e"
"photon.scroll_bar" = "#3b4261BB"

"photon.button.primary.background" = "#3d59a1"
"photon.button.primary.foreground" = "$text"

# tab
"photon.tab.active.background" = "$primary-background"
"photon.tab.active.foreground" = "$text"
"photon.tab.active.underline" = "#7aa2f7"

"photon.tab.inactive.background" = "$secondary-background"
"photon.tab.inactive.foreground" = "$dim-text"
"photon.tab.inactive.underline" = "#7aa2f777"

"photon.tab.separator" = ""

"photon.icon.active" = "$text"
"photon.icon.inactive" = "$dim-text"

"photon.remote.icon" = "$black"
"photon.remote.local" = "#7aa2f7"
"photon.remote.connected" = "#9ece6a"
"photon.remote.connecting" = "#e0af68"
"photon.remote.disconnected" = "#f7768e"

"photon.plugin.name" = "#c0caf5"
"photon.plugin.description" = "$text"
"photon.plugin.author" = "#737aa2"

"editor.background" = "$primary-background"
"editor.foreground" = "$text"
"editor.dim" = "$dim-text"
"editor.focus" = "#c0caf5"
"editor.caret" = "#c0caf5"
"editor.selection" = "#283457"
"editor.current_line" = "$current-background"
"editor.debug_break_line" = "#7aa2f737"
"editor.link" = "$blue"
"editor.visible_whitespace" = "$grey"
"editor.indent_guide" = "$grey"
"editor.drag_drop_background" = "#7aa2f755"
"editor.drag_drop_tab_background" = "#0b0e1455"
"editor.sticky_header_background" = "$primary-background"

"inlay_hint.foreground" = "$text"
"inlay_hint.background" = "#3d59a155"

"error_lens.error.foreground" = "$red"
"error_lens.error.background" = "#f7768e20"
"error_lens.warning.foreground" = "$yellow"
"error_lens.warning.background" = "#e0af6820"
"error_lens.other.foreground" = "$dim-text"
"error_lens.other.background" = "#565f8920"

"completion_lens.foreground" = "$dim-text"

"source_control.added" = "#9ece6aCC"
"source_control.removed" = "#f7768eCC"
"source_control.modified" = "#7aa2f7CC"

"tooltip.background" = "$secondary-background"
"tooltip.foreground" = "$text"

"palette.background" = "$secondary-background"
"palette.foreground" = "$text"
"palette.current.background" = "$current-background"
"palette.current.foreground" = "$text"

"completion.background" = "$secondary-background"
"completion.current" = "$current-background"

"hover.background" = "$secondary-background"

"activity.background" = "$secondary-background"
"activity.current" = "$primary-background"

"debug.breakpoint" = "$red"
"debug.breakpoint.hover" = "#f7768e66"

"panel.background" = "$secondary-background"
"panel.foreground" = "$text"
"panel.foreground.dim" = "$dim-text"
"panel.current.background" = "$current-background"
"panel.current.foreground" = "$text"
"panel.current.foreground.dim" = "$dim-text"
"panel.hovered.background" = "#292e42"
"panel.hovered.active.background" = "$grey"
"panel.hovered.foreground" = "$text"
"panel.hovered.foreground.dim" = "$dim-text"

# Lualine-style status bar (like the LazyVim mock): blue background, dark text
"status.background" = "$blue"
"status.foreground" = "#15161e"
"status.modal.normal.background" = "$blue"
"status.modal.normal.foreground" = "#15161e"
"status.modal.insert.background" = "$green"
"status.modal.insert.foreground" = "#15161e"
"status.modal.visual.background" = "$magenta"
"status.modal.visual.foreground" = "#15161e"
"status.modal.terminal.background" = "$purple"
"status.modal.terminal.foreground" = "#15161e"

"markdown.blockquote" = "$dim-text"

"terminal.cursor" = "$text"
"terminal.foreground" = "$text"
"terminal.background" = "$primary-background"
"terminal.white" = "#a9b1d6"
"terminal.black" = "#414868"
"terminal.red" = "$red"
"terminal.blue" = "$blue"
"terminal.green" = "$green"
"terminal.yellow" = "$yellow"
"terminal.cyan" = "$cyan"
"terminal.magenta" = "$magenta"
"terminal.bright_white" = "$text"
"terminal.bright_red" = "#ff899d"
"terminal.bright_blue" = "$blue"
"terminal.bright_green" = "$green"
"terminal.bright_yellow" = "$yellow"
"terminal.bright_cyan" = "$cyan"
"terminal.bright_magenta" = "$magenta"
"terminal.bright_black" = "#545c7e"
