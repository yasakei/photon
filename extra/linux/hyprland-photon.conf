# Photon frosted-glass blur (Hyprland)
# ================================
# Photon already submits a translucent window (core.window-transparent),
# so on stock Hyprland blur just works — no rule needed.
#
# ONLY needed if you globally disable window blur like:
#     windowrulev2 = noblur, class:.*
# Then exempt Photon so the compositor blurs behind it:
windowrulev2 = noblur, class:^(?!photon$).*$, title:^(?!.*Photon.*$).*$

# NOTE (Sep 2026): Photon currently reports an EMPTY Wayland app-id
# (upstream floem 0.2 doesn't plumb winit's app_id through), so the
# title half of the rule above is what actually matches
# (titles always end in " - Photon"). If a future floem sets the
# app-id, the class half takes over.
#
# hyprlua (lua-based configs) equivalent:
#     hl.window_rule({match = {class = "^(?!photon$).*$", title = "^(?!.*Photon.*$).*$" }, no_blur = true })
